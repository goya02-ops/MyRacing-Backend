name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_segura
          MYSQL_DATABASE: myracing
          MYSQL_USER: admin
          MYSQL_PASSWORD: MiR@cing_2025!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u admin -pMiR@cing_2025!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: myracing
      DB_USER: admin
      DB_PASSWORD: MiR@cing_2025!
      JWT_SECRET: ci_secret_for_tests
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests
      MERCADOPAGO_ACCESS_TOKEN: ci_mp_token_for_tests 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Gate de producción: solo corre en PRs a main y pushes a main.
    # En develop no corre (ahí solo se exige que los tests pasen, sin coverage).
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Coverage total ≥80% (vitest thresholds)
        run: pnpm test:coverage

  quality-gate:
    name: Quality Gate (proyecto)
    runs-on: ubuntu-latest
    # Gate de producción: exige el Quality Gate del PROYECTO completo
    # (no solo del código nuevo del PR). Solo corre en PRs a main y pushes a main.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: SonarCloud Quality Gate del proyecto (bloquea el merge si falla)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Falta el secret SONAR_TOKEN: no se puede verificar el Quality Gate."
            exit 1
          fi
          status=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=goya02-ops_MyRacing-Backend" | jq -r '.projectStatus.status')
          echo "Quality Gate del proyecto: $status"
          if [ "$status" != "OK" ]; then
            echo "Quality Gate NO OK: este cambio no puede mergearse a main."
            exit 1
          fi