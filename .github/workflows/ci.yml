name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_segura
          MYSQL_DATABASE: myracing
          MYSQL_USER: admin
          MYSQL_PASSWORD: MiR@cing_2025!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u admin -pMiR@cing_2025!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: myracing
      DB_USER: admin
      DB_PASSWORD: MiR@cing_2025!
      JWT_SECRET: ci_secret_for_tests
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests (skips until test suite is added in F1)
        run: pnpm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Gate de producción: solo corre en PRs a main y pushes a main.
    # En develop no corre (ahí solo se exige que los tests pasen, sin coverage).
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Coverage total ≥80% (vitest thresholds)
        run: pnpm test:coverage

  quality-gate:
    name: Quality Gate (proyecto)
    runs-on: ubuntu-latest
    # Gate de producción: exige el Quality Gate del PROYECTO completo
    # (no solo del código nuevo del PR). Solo corre en PRs a main y pushes a main.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: SonarCloud Quality Gate del proyecto (bloquea el merge si falla)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Falta el secret SONAR_TOKEN: no se puede verificar el Quality Gate."
            exit 1
          fi
          status=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=goya02-ops_MyRacing-Backend" | jq -r '.projectStatus.status')
          echo "Quality Gate del proyecto: $status"
          if [ "$status" != "OK" ]; then
            echo "Quality Gate NO OK: este cambio no puede mergearse a main."
            exit 1
          fi