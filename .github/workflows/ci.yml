name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_segura
          MYSQL_DATABASE: myracing
          MYSQL_USER: admin
          MYSQL_PASSWORD: MiR@cing_2025!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u admin -pMiR@cing_2025!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: myracing
      DB_USER: admin
      DB_PASSWORD: MiR@cing_2025!
      JWT_SECRET: ci_secret_for_tests
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests (skips until test suite is added in F1)
        run: pnpm run test --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore